# XcodeGen specification for the macOS app. The generated iOSDeveloperToolkit.xcodeproj is
# committed, so building does not require XcodeGen; regenerate after adding app targets with:
#   xcodegen generate
name: iOSDeveloperToolkit
options:
  bundleIdPrefix: io.hideouts
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Toolkit:
    path: .
targets:
  FirmwareHelpers:
    type: tool
    platform: macOS
    legacy:
      toolPath: /bin/bash
      arguments: '"$(SRCROOT)/scripts/build-restore-helpers.sh"'
      passSettings: true
      workingDirectory: $(SRCROOT)
  iOSDeveloperToolkit:
    type: application
    platform: macOS
    sources:
      - path: App/iOSDeveloperToolkit
    dependencies:
      - target: FirmwareHelpers
        link: false
        embed: false
      - package: Toolkit
        product: ToolkitCore
      - package: Toolkit
        product: DeviceKit
      - package: Toolkit
        product: ToolkitFeatures
    postBuildScripts:
      - script: '"$SRCROOT/scripts/embed-restore-helpers.sh"'
        name: Embed Firmware Helpers
        shell: /bin/bash
        showEnvVars: false
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/embed-restore-helpers.sh
          - $(SRCROOT)/build-output/restore-helpers/out/bin/idevicerestore
          - $(SRCROOT)/build-output/restore-helpers/out/bin/irecovery
          - $(SRCROOT)/build-output/restore-helpers/out/SOURCES.txt
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/idevicerestore/AUTHORS
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/idevicerestore/COPYING
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libimobiledevice-glue/COPYING
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libimobiledevice/AUTHORS
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libimobiledevice/COPYING
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libimobiledevice/COPYING.LESSER
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libirecovery/COPYING
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libplist/AUTHORS
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libplist/COPYING
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libplist/COPYING.LESSER
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libtatsu/COPYING
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libusbmuxd/AUTHORS
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libusbmuxd/COPYING
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libzip/AUTHORS
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/libzip/LICENSE
          - $(SRCROOT)/build-output/restore-helpers/out/licenses/openssl/LICENSE.txt
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Helpers
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Helpers/idevicerestore
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Helpers/irecovery
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/SOURCES.txt
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/idevicerestore
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libimobiledevice
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libimobiledevice-glue
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libirecovery
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libplist
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libtatsu
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libusbmuxd
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libzip
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/openssl
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/idevicerestore/AUTHORS
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/idevicerestore/COPYING
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libimobiledevice-glue/COPYING
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libimobiledevice/AUTHORS
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libimobiledevice/COPYING
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libimobiledevice/COPYING.LESSER
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libirecovery/COPYING
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libplist/AUTHORS
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libplist/COPYING
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libplist/COPYING.LESSER
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libtatsu/COPYING
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libusbmuxd/AUTHORS
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libusbmuxd/COPYING
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libzip/AUTHORS
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/libzip/LICENSE
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Resources/Licenses/restore-helpers/openssl/LICENSE.txt
    settings:
      base:
        PRODUCT_NAME: "iOS Developer Toolkit (Swift)"
        PRODUCT_MODULE_NAME: iOSDeveloperToolkitApp
        PRODUCT_BUNDLE_IDENTIFIER: io.hideouts.iOSDeveloperToolkit
        INFOPLIST_FILE: App/iOSDeveloperToolkit/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/iOSDeveloperToolkit/iOSDeveloperToolkit.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        COMBINE_HIDPI_IMAGES: YES
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH[config=Debug]: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  iOSDeveloperToolkitUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: App/UITests
    dependencies:
      - target: iOSDeveloperToolkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.hideouts.iOSDeveloperToolkitUITests
        TEST_TARGET_NAME: iOSDeveloperToolkit
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
schemes:
  iOSDeveloperToolkit:
    build:
      targets:
        iOSDeveloperToolkit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iOSDeveloperToolkitUITests
    archive:
      config: Release
